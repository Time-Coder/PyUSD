exclude = [
    ".git",
    "__pycache__",
    ".venv*",
    ".vscode",
    "build",
    "dist",
    "*.egg-info",
    "doc"
]

target-version = "py37"

line-length = 88

[lint]
select = [
    "E", "W", "F", "I", "B", "UP", "C4", "SIM"
]

ignore = ["E501", "UP045", "UP006", "UP007"]
fixable = ["ALL"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"