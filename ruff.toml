exclude = [
    ".git",
    "__pycache__",
    ".venv*",
    ".vscode",
    "build",
    "dist",
    "*.egg-info",
    "doc"
]

# py310, not py37: pygf imports typing.TypeAlias in ten modules with no
# typing_extensions fallback, which is 3.10+. The declared 3.7 floor let ruff
# apply rewrites that would not run on the minimum supported interpreter.
target-version = "py310"

line-length = 88

[lint]
select = [
    "E", "W", "F", "I", "B", "UP", "C4", "SIM"
]

# UP006/UP007/UP035 are the typing.List -> list family. They are ignored rather
# than applied because the generated schema stubs emit `List[...]` from the
# USDA type names, and code_generator.py rewrites those verbatim: fixing them
# here would be undone by the next generator run.
ignore = ["E501", "UP045", "UP006", "UP007", "UP035"]
fixable = ["ALL"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"